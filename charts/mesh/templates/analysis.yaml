# Used by every Rollout (canary.analysis). Aborts the rollout when the canary's
# success ratio, measured at the waypoint, drops below 95% -- or when there is
# no data at all: no traffic means nothing was verified, so it must not pass.
# (An earlier version accepted NaN/empty results and promoted a bad release
# while the load test was not running. See docs/LAB-REPORT.md.)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: {{ .Values.namespace }}
spec:
  args:
    - name: service
  metrics:
    - name: success-rate
      interval: 15s
      initialDelay: 30s
      failureLimit: 3
      successCondition: 'len(result) > 0 && !isNaN(result[0]) && result[0] >= 0.95'
      provider:
        prometheus:
          address: {{ .Values.prometheusAddress }}
          query: |
            sum(irate(istio_requests_total{reporter="waypoint",destination_service_name="{{`{{args.service}}`}}",response_code!~"5.*"}[1m]))
            /
            sum(irate(istio_requests_total{reporter="waypoint",destination_service_name="{{`{{args.service}}`}}"}[1m]))
