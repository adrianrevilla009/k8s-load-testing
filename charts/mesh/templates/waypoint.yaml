{{- if .Values.waypoint }}
# One waypoint (Envoy) for the namespace: VirtualService routing / mirroring / weights
# only take effect for traffic that passes through it. The Makefile labels the
# namespace with istio.io/use-waypoint=waypoint once this Gateway is Programmed.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: {{ .Values.namespace }}
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
{{- end }}
